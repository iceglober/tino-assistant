{{- if .Values.postgresql.enabled }}
# Dev-grade bundled Postgres (pgvector). NOT for production: single instance,
# no backups. Point DATABASE_URL at postgres://<user>:<pw>@{{ include "tino.fullname" . }}-postgres:5432/<db>
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tino.fullname" . }}-postgres
  labels:
    {{- include "tino.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
      name: pg
  clusterIP: None
  selector:
    {{- include "tino.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tino.fullname" . }}-postgres
  labels:
    {{- include "tino.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "tino.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "tino.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "tino.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
{{- end }}
