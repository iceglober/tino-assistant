apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tino.fullname" . }}
  labels:
    {{- include "tino.labels" . | nindent 4 }}
spec:
  # Hard singleton: Slack Socket Mode splits events across connections and the
  # KB indexer assumes one instance. Recreate avoids a two-pod overlap during
  # rollouts. Do not scale.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tino.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tino.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "tino.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tino
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PERSISTENCE_ADAPTER
              value: postgres
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: CONSOLE_BASE_URL
              value: {{ required "consoleBaseUrl is required" .Values.consoleBaseUrl | quote }}
            {{- if .Values.allowedEmailDomain }}
            - name: CONSOLE_ALLOWED_DOMAIN
              value: {{ .Values.allowedEmailDomain | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "tino.secretName" . }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- range .Values.extraContainers }}
        - {{ tpl (toYaml .) $ | nindent 10 | trim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
