# KayN's values for the generic tino chart (GKE Autopilot, quiet-spirit-503422-u3).
# NOTE: destined to move to the kn-eng repo; lives here temporarily.
#
# DATABASE_URL (in the tino-env k8s Secret) uses the TCP form via the
# cloud-sql-proxy sidecar: postgres://tino:PW@127.0.0.1:5432/tino

image:
  repository: us-central1-docker.pkg.dev/quiet-spirit-503422-u3/tino/tino
  # tag set per-deploy by scripts/gcp-deploy.sh (git sha)

consoleBaseUrl: https://tino.kayn.ai
allowedEmailDomain: kayn.ai

env:
  GOOGLE_VERTEX_PROJECT: quiet-spirit-503422-u3
  GOOGLE_VERTEX_LOCATION: us-central1
  LOG_LEVEL: info

existingSecret: tino-env

serviceAccount:
  # Workload Identity → Vertex embeddings + Cloud SQL, no keys anywhere.
  annotations:
    iam.gke.io/gcp-service-account: tino-run@quiet-spirit-503422-u3.iam.gserviceaccount.com

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: tino-ip
    networking.gke.io/managed-certificates: tino-cert
  hosts:
    - host: tino.kayn.ai
      paths: [{ path: /, pathType: Prefix }]

extraContainers:
  - name: cloud-sql-proxy
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
    args:
      - "--structured-logs"
      - "--port=5432"
      - "quiet-spirit-503422-u3:us-central1:tino-pg"
    securityContext:
      runAsNonRoot: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 256Mi }

extraManifests:
  - |
    apiVersion: networking.gke.io/v1
    kind: ManagedCertificate
    metadata:
      name: tino-cert
    spec:
      domains: [tino.kayn.ai]
