services:
  postgres:
    # pgvector-enabled Postgres — matches Cloud SQL (POSTGRES_16 + vector ext).
    # Needed for `bun run dev:pg` and the pg adapter contract tests
    # (TEST_DATABASE_URL=postgres://tino:tino@localhost:5433/tino).
    # sqlite remains the zero-dependency dev default (KB features off).
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: tino
      POSTGRES_PASSWORD: tino
      POSTGRES_DB: tino
    volumes:
      - tino-pg-data:/var/lib/postgresql/data

volumes:
  tino-pg-data:
